<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; connect-src ws: wss:; style-src 'self' 'unsafe-inline'">
  <title>사랑방</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 로그인 -->
  <section id="login" class="center" hidden>
    <form id="loginForm" class="card">
      <h1>사랑방</h1>
      <label>서버 주소<input id="fUrl" placeholder="ws://192.168.0.10:7070" required></label>
      <label>닉네임<input id="fNick" maxlength="20" required></label>
      <label>비밀번호<input id="fPass" type="password" required></label>
      <label>서버 접속 암호 <small>(가입할 때만, 서버에 설정된 경우)</small><input id="fServerPass" type="password"></label>
      <p id="loginError" class="error"></p>
      <div class="row">
        <button type="submit" class="primary">로그인</button>
        <button type="button" id="btnRegister">새로 가입</button>
      </div>
    </form>
  </section>

  <!-- 채팅 -->
  <section id="app" hidden>
    <aside id="sidebar">
      <header><strong id="meNick"></strong><button id="btnLogout" title="로그아웃">나가기</button></header>
      <div id="invites"></div>
      <h2>알림 <span id="noticeCount" class="badge" hidden></span><span class="actions"><button id="btnNoticeClear" hidden>모두 지우기</button></span></h2>
      <ul id="noticeList"></ul>
      <h2>채팅방 <span class="actions"><button id="btnBrowse" title="공개 방 찾기">찾기</button><button id="btnCreate" title="방 만들기">＋</button></span></h2>
      <ul id="roomList"></ul>
      <h2>사람들 <small>(누르면 1:1 창)</small></h2>
      <ul id="userList"></ul>
    </aside>

    <main>
      <div id="banner" hidden>서버 연결이 끊겼습니다. 다시 연결하는 중…</div>
      <header id="chatHeader">
        <strong id="chatTitle">방을 선택하세요</strong>
        <span class="actions">
          <button id="btnInvite" hidden>초대</button>
          <button id="btnLeave" hidden>방 나가기</button>
        </span>
      </header>
      <div id="messages"></div>
      <div id="replyBar" hidden><span id="replyText"></span><button id="btnReplyCancel">✕</button></div>
      <form id="composer" hidden>
        <div id="toolbar">
          <button type="button" class="fmt" data-cmd="bold" title="굵게 (Ctrl+B)"><b>가</b></button>
          <button type="button" class="fmt" data-cmd="italic" title="기울임 (Ctrl+I)"><i>가</i></button>
          <button type="button" class="fmt" data-cmd="underline" title="밑줄 (Ctrl+U)"><u>가</u></button>
          <button type="button" class="fmt" data-cmd="strikeThrough" title="취소선"><s>가</s></button>
          <span class="sep fmt"></span>
          <button type="button" class="fmt bg-yellow" data-bg="yellow" title="배경색: 노랑">가</button>
          <button type="button" class="fmt bg-green" data-bg="green" title="배경색: 초록">가</button>
          <button type="button" class="fmt bg-pink" data-bg="pink" title="배경색: 분홍">가</button>
          <button type="button" class="fmt bg-blue" data-bg="blue" title="배경색: 파랑">가</button>
          <button type="button" class="fmt" data-bg="" title="배경색 없애기">⌫</button>
          <span class="sep fmt"></span>
          <button type="button" class="fmt sz-s" data-size="s" title="작게">가</button>
          <button type="button" class="fmt sz-l" data-size="l" title="크게">가</button>
          <button type="button" class="fmt sz-xl" data-size="xl" title="아주 크게">가</button>
          <span class="sep fmt"></span>
          <button type="button" class="fmt" id="btnClearFmt" title="선택한 글자의 서식 지우기">서식 지우기</button>
          <span class="grow"></span>
          <select id="codeLang" hidden title="코드 언어"></select>
          <button type="button" id="btnCode" title="코드·쿼리 입력">&lt;/&gt; 코드</button>
        </div>
        <div id="composeRow">
          <button type="button" id="btnAttach" title="파일·이미지 보내기">📎</button>
          <div id="input" contenteditable="true" spellcheck="false" data-placeholder="메시지 입력 (@닉네임으로 호출)" title="Enter 전송, Shift+Enter 줄바꿈"></div>
          <textarea id="codeInput" hidden spellcheck="false" placeholder="코드나 쿼리를 입력하세요"></textarea>
          <button type="submit" class="primary">보내기</button>
        </div>
        <div id="composeHint"></div>
      </form>
    </main>

    <aside id="members" hidden>
      <h2>구성원</h2>
      <ul id="memberList"></ul>
    </aside>
  </section>

  <!-- 입력/선택 창 -->
  <div id="modal" class="center overlay" hidden>
    <form id="modalForm" class="card">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <p id="modalError" class="error"></p>
      <div class="row"><button type="submit" class="primary" id="modalOk">확인</button><button type="button" id="modalCancel">닫기</button></div>
    </form>
  </div>

  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
